# Reverse-proxy задания 4: хост :8080 → контейнер Nginx :80 → FastAPI :8000.
# Имя simple_python_app резолвится встроенным DNS сети frontend-net.
server {
    listen 80;
    server_name localhost;

    # Стандартная заглушка nginx для ошибок шлюза (приложение ещё не поднялось).
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location / {
        proxy_pass http://simple_python_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
