# =============================================================================
#  Redis на хосте (dev/prod). В local-стеке контейнер redis этот файл не читает:
#  там параметры заданы в command: compose.yaml.
#
#  Слушаем только localhost — с хоста виден 127.0.0.1:6379, с контейнера app
#  доступ через extra_hosts: host.docker.internal.
# =============================================================================
bind 127.0.0.1
port 6379
protected-mode yes
# Снимок на диск, если за 60 с была хотя бы 1 запись (кэш /report).
save 60 1
loglevel notice
