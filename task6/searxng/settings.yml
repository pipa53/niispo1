# =============================================================================
#  SearXNG — метапоиск для Open WebUI (WEB_SEARCH_ENGINE=searxng).
#
#  Контейнер монтирует эту папку в /etc/searxng (read-only).
#  Open WebUI ходит внутрь сети: http://searxng:8080/search?q=<query>
#  На хосте UI поиска: http://127.0.0.1:8085
# =============================================================================

# Берём дефолты образа и переопределяем только нужное.
use_default_settings: true

server:
  # Внутри контейнера; наружу проброшен 8085:8080.
  port: 8080
  bind_address: "0.0.0.0"
  # Секрет сессий SearXNG. Для лабораторного стенда фиксированная строка.
  secret_key: "e3b0c44298fc1c1"
  # Rate-limiter выключен: иначе локальные запросы из Open WebUI ловят 429.
  limiter: false

search:
  # 0 — без фильтра, 1 — умеренный safe search.
  safe_search: 1
  formats:
    - html
    - json   # нужен Open WebUI (он забирает выдачу JSON-ом)
