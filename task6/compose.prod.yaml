# =============================================================================
#  Prod: в контейнере только приложение (и одноразовый Liquibase на деплое).
#  PostgreSQL, Redis, Nginx — системные службы хоста.
#
#  Nginx: deploy/nginx/prod.conf  (слушает 80, проксирует на 127.0.0.1:8000)
#  Redis:  deploy/redis/redis.conf
#
#    make prod-up
# =============================================================================
name: library-prod

services:
  liquibase:
    build: ./liquibase
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      # Те же миграции, что в local/dev; URL — Postgres на хосте, не контейнер `db`.
      - --url=jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}
      - --changeLogFile=changelog.xml
      - update
    restart: "no"

  app:
    build: ./app
    image: library-app:prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Postgres и Redis — службы хоста (не контейнеры local-стека).
      API_DB_HOST: host.docker.internal
      API_DB_PORT: "5432"
      API_DB_NAME: ${POSTGRES_DB}
      API_DB_USER: ${POSTGRES_USER}
      API_DB_PASS: ${POSTGRES_PASSWORD}
      API_REDIS_HOST: host.docker.internal
      API_REDIS_PORT: "6379"
    ports:
      # Без bind-mount: код только из образа. Nginx хоста — deploy/nginx/prod.conf.
      - "127.0.0.1:8000:8000"
    depends_on:
      liquibase:
        condition: service_completed_successfully
    restart: unless-stopped