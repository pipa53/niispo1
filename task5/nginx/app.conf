# =============================================================================
#  Nginx — reverse proxy перед FastAPI-приложением.
#  Слушает 80 внутри контейнера, все запросы проксирует на сервис app:8000
#  (имя сервиса из compose.yaml, резолвится Docker DNS).
# =============================================================================
server {
    listen 80;
    server_name localhost;

    # Страницы ошибок 5xx — отдаём стандартную заглушку nginx.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Все запросы — на FastAPI-приложение.
    location / {
        proxy_pass http://app:8000;

        # Пробрасываем исходные заголовки, чтобы приложение видело
        # реальный Host и IP клиента, а не адрес Nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}