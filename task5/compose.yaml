# =============================================================================
#  Оркестрация проекта «Учёт читателей библиотеки» (задание 5, вариант 1).
#
#  Сервисы:
#    db        — PostgreSQL, источник данных.
#    liquibase — одноразовый контейнер, применяет миграции и завершается.
#    app       — FastAPI-приложение с CRUD.
#    web       — Nginx, reverse-proxy перед app, единственная точка входа.
#
#  Порядок запуска гарантируется через depends_on + condition:
#    db Healthy  ->  liquibase завершился успешно  ->  app стартует.
# =============================================================================
name: library-app

services:

  # ---------- PostgreSQL ----------
  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_PASSWORD: apipass
      POSTGRES_DB: api
      POSTGRES_USER: apiuser
    volumes:
      # Именованный volume — данные БД переживают пересоздание контейнера.
      - dbdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      # pg_isready с явным пользователем и БД — чтобы в логах не было
      # повторяющихся FATAL: role "root" does not exist.
      test: ["CMD-SHELL", "pg_isready -U apiuser -d api"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- Liquibase (одноразовый) ----------
  liquibase:
    build: ./liquibase
    depends_on:
      # Ждём не просто «запущен», а «здоров» — иначе Liquibase
      # не сможет подключиться к ещё инициализирующейся БД.
      db:
        condition: service_healthy
    networks:
      - backend-net
    # `update` — применить все неприменённые миграции из changelog.
    command: --defaults-file=/liquibase/changelog/liquibase.properties update
    # Не перезапускать: после успешного применения контейнер должен завершиться.
    restart: "no"

  # ---------- FastAPI-приложение ----------
  app:
    build: ./app
    image: library-app:latest
    environment:
      API_DB_HOST: db
      API_DB_PORT: "5432"
      API_DB_NAME: api
      API_DB_USER: apiuser
      API_DB_PASS: apipass
    depends_on:
      db:
        condition: service_healthy
      liquibase:
        # Ключевое условие: app стартует ТОЛЬКО после успешного завершения
        # контейнера Liquibase. Так таблицы гарантированно созданы и заполнены.
        condition: service_completed_successfully
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  # ---------- Nginx ----------
  web:
    image: nginx:alpine
    ports:
      # На хосте порт 8080 (порт 80 занят системной службой Windows),
      # внутри контейнера — стандартный 80.
      - "8080:80"
    networks:
      - frontend-net
    volumes:
      - type: bind
        source: ./nginx/app.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      - app
    restart: unless-stopped  # после сбоя контейнер поднимается сам, кроме docker stop

# ---------- Сети ----------
networks:
  # web <-> app: Nginx видит приложение, но не видит БД.
  frontend-net:
  # app <-> db <-> liquibase: только здесь есть доступ к базе.
  backend-net:

# ---------- Тома ----------
volumes:
  # Данные PostgreSQL. Удаляется только через `docker compose down -v`.
  dbdata: